# secure-repo:managed
# Generated by secure-repo — do not hand-edit.
# Re-run `secure-repo` in the repo root to regenerate. See README.md.

name: dependabot-automerge
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  pull-requests: write
  contents: write
concurrency:
  group: dependabot-automerge
  cancel-in-progress: true
jobs:
  automerge:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge ready semantic patch Dependabot updates
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import urlencode

          SEMVER = re.compile(r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")
          BUMP_TITLE = re.compile(r"^Bump ([^\s]+) from (\S+) to (\S+)$")
          COMMIT_SHA = re.compile(r"^[0-9a-f]{40}$")


          class OperationalError(RuntimeError):
              pass


          def parse_version(value):
              if not isinstance(value, str):
                  return None
              match = SEMVER.fullmatch(value)
              if match is None:
                  return None
              return tuple(int(part) for part in match.groups())


          def is_patch_update(title):
              if not isinstance(title, str):
                  return False
              match = BUMP_TITLE.fullmatch(title)
              if match is None:
                  return False
              previous = parse_version(match.group(2))
              current = parse_version(match.group(3))
              return (
                  previous is not None
                  and current is not None
                  and previous[:2] == current[:2]
                  and current[2] > previous[2]
              )


          def repository_name(ref):
              if not isinstance(ref, dict):
                  return None
              repo = ref.get("repo")
              if not isinstance(repo, dict):
                  return None
              return repo.get("full_name")


          def pull_request_head_sha(pull_request):
              if not isinstance(pull_request, dict):
                  return None
              head = pull_request.get("head")
              if not isinstance(head, dict):
                  return None
              sha = head.get("sha")
              if not isinstance(sha, str) or COMMIT_SHA.fullmatch(sha) is None:
                  return None
              return sha


          def is_eligible_pull_request(pull_request, repository, default_branch):
              if not isinstance(pull_request, dict) or pull_request.get("state") != "open":
                  return False
              user = pull_request.get("user")
              if not isinstance(user, dict) or user.get("login") != "dependabot[bot]":
                  return False
              base = pull_request.get("base")
              head = pull_request.get("head")
              return (
                  isinstance(base, dict)
                  and base.get("ref") == default_branch
                  and repository_name(base) == repository
                  and repository_name(head) == repository
                  and pull_request_head_sha(pull_request) is not None
              )


          def run(command):
              try:
                  return subprocess.run(command, check=False, capture_output=True, text=True)
              except OSError as error:
                  raise OperationalError("could not execute gh") from error


          def api(endpoint, paginate=False):
              command = ["gh", "api"]
              if paginate:
                  command.extend(["--paginate", "--slurp"])
              result = run(command + [endpoint])
              if result.returncode:
                  raise OperationalError(f"API request failed for {endpoint} (gh exit {result.returncode})")
              try:
                  return json.loads(result.stdout)
              except json.JSONDecodeError:
                  raise OperationalError(f"API request returned invalid JSON for {endpoint}") from None


          def pull_request_is_ready(pull_request):
              mergeable = pull_request.get("mergeable")
              mergeable_state = pull_request.get("mergeable_state")
              if type(mergeable) not in (bool, type(None)) or not isinstance(mergeable_state, str):
                  raise OperationalError("pull request readiness data is malformed")
              return mergeable is True and mergeable_state == "clean"


          def scan(request, merge, repository, log):
              if not isinstance(repository, str) or not repository:
                  raise OperationalError("GITHUB_REPOSITORY is missing or invalid")
              details = request(f"repos/{repository}")
              if not isinstance(details, dict):
                  raise OperationalError("repository API response is malformed")
              default_branch = details.get("default_branch")
              if not isinstance(default_branch, str) or not default_branch:
                  raise OperationalError("repository API response has no default branch")
              query = urlencode({"state": "open", "base": default_branch, "per_page": "100"})
              pages = request(f"repos/{repository}/pulls?{query}", paginate=True)
              if not isinstance(pages, list):
                  raise OperationalError("pull request list API response is malformed")
              for page in pages:
                  if not isinstance(page, list):
                      raise OperationalError("pull request page API response is malformed")
                  for summary in page:
                      if not isinstance(summary, dict):
                          raise OperationalError("pull request summary API response is malformed")
                      number = summary.get("number")
                      if not isinstance(number, int) or isinstance(number, bool) or number < 1:
                          raise OperationalError("pull request summary has an invalid number")
                      pull_request = request(f"repos/{repository}/pulls/{number}")
                      if not (
                          is_eligible_pull_request(pull_request, repository, default_branch)
                          and is_patch_update(pull_request.get("title"))
                      ):
                          continue

                      pull_request = request(f"repos/{repository}/pulls/{number}")
                      if not (
                          is_eligible_pull_request(pull_request, repository, default_branch)
                          and is_patch_update(pull_request.get("title"))
                      ):
                          log(f"PR #{number} changed before merge; skipped")
                          continue
                      head_sha = pull_request_head_sha(pull_request)
                      if not pull_request_is_ready(pull_request):
                          log(f"PR #{number} not ready; retry later")
                          continue

                      result = merge(number, head_sha)
                      if result.returncode == 0:
                          log(f"PR #{number} merged")
                          continue

                      refreshed = request(f"repos/{repository}/pulls/{number}")
                      refreshed_head_sha = pull_request_head_sha(refreshed)
                      if refreshed_head_sha is not None and refreshed_head_sha != head_sha:
                          log(f"PR #{number} head changed before merge; skipped")
                          continue
                      if not (
                          is_eligible_pull_request(refreshed, repository, default_branch)
                          and is_patch_update(refreshed.get("title"))
                      ):
                          raise OperationalError(f"merge failed for PR #{number} after PR state changed")
                      if not pull_request_is_ready(refreshed):
                          log(f"PR #{number} not ready; retry later")
                          continue
                      raise OperationalError(f"merge failed for PR #{number} (gh exit {result.returncode})")


          def main():
              repository = os.environ.get("GITHUB_REPOSITORY", "")

              def merge(number, head_sha):
                  return run(
                      [
                          "gh",
                          "pr",
                          "merge",
                          "--repo",
                          repository,
                          "--squash",
                          "--match-head-commit",
                          head_sha,
                          str(number),
                      ]
                  )

              try:
                  scan(api, merge, repository, print)
              except OperationalError as error:
                  print(f"dependabot-automerge: {error}", file=sys.stderr)
                  return 1
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
