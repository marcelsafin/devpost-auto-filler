# secure-repo:managed
# Generated by secure-repo — do not hand-edit.
# Re-run `secure-repo` in the repo root to regenerate. See README.md.

name: codeql
on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
  security-events: write
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: "javascript-typescript"
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
